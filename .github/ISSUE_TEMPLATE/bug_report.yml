name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Quickest way: in Beka's panel, ⋮ → **Report**. The form fills in the version and device, then saves a zip bundle to `Download/beka-debug/`.
        The bundle can contain chat text, screen content and app names — check it before attaching it here, because this issue is public.
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Ask Beka to …"
  - type: input
    id: version
    attributes:
      label: Beka version
      description: Settings → Updates
      placeholder: "0.1.120"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 8, Android 16"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: AI provider / model
      placeholder: "OpenRouter · anthropic/claude-haiku"
