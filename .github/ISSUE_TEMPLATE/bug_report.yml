name: Laporan bug
description: Ada yang tidak jalan seperti seharusnya
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Cara tercepat: di panel Beka, ⋮ → **Laporkan**. Form itu mengisi versi dan perangkat, lalu menyimpan bundel zip di `Download/beka-debug/`.
        Bundel bisa berisi isi chat, isi layar, dan nama aplikasi — periksa dulu sebelum dilampirkan di sini, karena issue ini publik.
  - type: textarea
    id: happened
    attributes:
      label: Apa yang terjadi?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Seharusnya bagaimana?
  - type: textarea
    id: steps
    attributes:
      label: Langkah untuk mengulang
      placeholder: "1. Buka …\n2. Minta Beka …"
  - type: input
    id: version
    attributes:
      label: Versi Beka
      description: Setelan → Lainnya
      placeholder: "0.1.120"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Perangkat dan versi Android
      placeholder: "Pixel 8, Android 16"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Provider / model AI
      placeholder: "OpenRouter · anthropic/claude-haiku"
