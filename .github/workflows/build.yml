name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # A tag build is a release: never cancel it half way.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to name nightly builds after the last stable release.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Fork PRs get no secrets, and PR builds must not carry the release key.
      - name: Restore signing keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.BEKA_KEYSTORE_B64 }}
        run: |
          # A fork without the secret builds with the default debug key.
          [ -n "$KEYSTORE_B64" ] || exit 0
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dev.p12"
          echo "BEKA_KEYSTORE=$RUNNER_TEMP/dev.p12" >> "$GITHUB_ENV"

      # Tags are stable releases (release build: not debuggable, no log recording by default);
      # everything else is a debug build. A manual run builds both, to check the release build.
      - name: Work out the version and build type
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "BEKA_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "APP_TASKS=:app:assembleRelease" >> "$GITHUB_ENV"
            echo "APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            # After a stable release, nightly is "<last release>+<run>" so it never looks older than stable.
            LAST_TAG=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)
            if [[ -n "$LAST_TAG" ]]; then
              echo "BEKA_VERSION_NAME=${LAST_TAG#v}+${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            fi
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              echo "APP_TASKS=:app:assembleDebug :app:assembleRelease" >> "$GITHUB_ENV"
            else
              echo "APP_TASKS=:app:assembleDebug" >> "$GITHUB_ENV"
            fi
            echo "APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          BEKA_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.BEKA_KEYSTORE_PASSWORD || '' }}
        run: ./gradlew --no-daemon :core:llm:test :core:memory:test :core:agent:test :core:rules:test :core:web:test :core:mcp:test $APP_TASKS

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/*/build/reports/tests/

      - name: Collect apk and version info
        if: github.event_name != 'pull_request'
        run: |
          cp "$APK" beka.apk
          VERSION_NAME="${BEKA_VERSION_NAME:-0.1.${{ github.run_number }}}"
          printf '{"versionCode": %s, "versionName": "%s", "commit": "%s"}\n' \
            "${{ github.run_number }}" "$VERSION_NAME" "${GITHUB_SHA::7}" > beka.json
          cat beka.json

      - name: Publish nightly release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease --title "Nightly" --notes "Build otomatis dari main"
          gh release upload nightly beka.apk beka.json --clobber
          gh release edit nightly --notes "Build #${{ github.run_number }} dari ${GITHUB_SHA::7}"

      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" beka.apk beka.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" beka.apk beka.json --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi
